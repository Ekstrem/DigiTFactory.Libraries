name: Build and push CommandRepository.Postgres

on:
  push:
    branches:
      - master
    paths:
      - CommandRepository.Postgres/**
      - Analyzers.Storage/**
      - .github/workflows/commandrepository-postgres.yml

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
      env:
          GITHUB_NUGET_AUTH_TOKEN: ${{secrets.PACK_ACCESS}}

    - name: Build analyzers (Storage)
      run: dotnet build Analyzers.Storage/DigiTFactory.Libraries.Analyzers.Storage.csproj --configuration Release

    - name: Build with dotnet
      run: dotnet build CommandRepository.Postgres/DigiTFactory.Libraries.CommandRepository.Postgres.csproj --configuration Release

    - name: Project pack
      run: dotnet pack CommandRepository.Postgres/DigiTFactory.Libraries.CommandRepository.Postgres.csproj --configuration Release --no-build --output bin/nupkgs

    - name: Nuget push to GitHub
      run: dotnet nuget push "bin/nupkgs/*.nupkg" --source https://nuget.pkg.github.com/Ekstrem/index.json --api-key ${{secrets.PACK_ACCESS}} --skip-duplicate

    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: Ekstrem

    - name: Nuget push NugetOrg
      run: dotnet nuget push "bin/nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate

name: Build and push SeedWorks

on:
  push:
    branches:
      - master
    paths:
      - Source/**
      - .github/workflows/**

jobs:
  build:
    runs-on: ubuntu-latest

    # OIDC-токен для NuGet Trusted Publishing (короткоживущий ключ вместо NUORG)
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
      env:
          GITHUB_NUGET_AUTH_TOKEN: ${{secrets.PACK_ACCESS}}

    - name: Build with dotnet
      run: dotnet build Source/DigiTFactory.Libraries.SeedWorks.csproj --configuration Release

    - name: Project pack
      run: dotnet pack Source/DigiTFactory.Libraries.SeedWorks.csproj --configuration Release --no-build --output bin/nupkgs

    - name: Nuget push to GitHub
      run: dotnet nuget push "bin/nupkgs/*.nupkg" --source https://nuget.pkg.github.com/Ekstrem/index.json --api-key ${{secrets.PACK_ACCESS}} --skip-duplicate

    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: Ekstrem

    - name: Nuget push NugetOrg
      run: dotnet nuget push "bin/nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate

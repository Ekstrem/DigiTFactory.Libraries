name: Build and push Analyzers

on:
  push:
    branches:
      - master
    paths:
      - 'Analyzers/**'
      - 'Analyzers.Domain/**'
      - 'Analyzers.DomainServices/**'
      - 'Analyzers.CrossCutting/**'
      - 'Analyzers.Storage/**'
      - 'Analyzers.Application/**'
      - .github/workflows/analyzers.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        project:
          - Analyzers.Domain/DigiTFactory.Libraries.Analyzers.Domain.csproj
          - Analyzers.DomainServices/DigiTFactory.Libraries.Analyzers.DomainServices.csproj
          - Analyzers.CrossCutting/DigiTFactory.Libraries.Analyzers.CrossCutting.csproj
          - Analyzers.Storage/DigiTFactory.Libraries.Analyzers.Storage.csproj
          - Analyzers.Application/DigiTFactory.Libraries.Analyzers.Application.csproj

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
      env:
          GITHUB_NUGET_AUTH_TOKEN: ${{secrets.PACK_ACCESS}}

    - name: Build with dotnet
      run: dotnet build ${{ matrix.project }} --configuration Release

    - name: Project pack
      run: dotnet pack ${{ matrix.project }} --configuration Release --no-build --output bin/nupkgs

    - name: Nuget push to GitHub
      run: dotnet nuget push "bin/nupkgs/*.nupkg" --source https://nuget.pkg.github.com/Ekstrem/index.json --api-key ${{secrets.PACK_ACCESS}} --skip-duplicate

    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: Ekstrem

    - name: Nuget push NugetOrg
      run: dotnet nuget push "bin/nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate

name: Build and push Testing

on:
  push:
    branches:
      - master
    paths:
      - Testing/**
      - .github/workflows/testing.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build with dotnet
      run: dotnet build Testing/DigiTFactory.Libraries.Testing.csproj --configuration Release

    - name: Project pack
      run: dotnet pack Testing/DigiTFactory.Libraries.Testing.csproj --configuration Release --no-build --output bin/nupkgs

    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: Ekstrem

    - name: Nuget push NugetOrg
      run: dotnet nuget push "bin/nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate
